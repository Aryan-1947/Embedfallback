name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/ -v

  # Evaluation harness runs (including domain-mismatch cases) are gated
  # behind provider API keys being present as repo secrets. This job is
  # intentionally separate from the unit-test job above so a missing/expired
  # API key doesn't block ordinary PRs -- but once secrets are configured,
  # wire this up as a required check to catch alignment-quality regressions.
  evaluation-harness:
    runs-on: ubuntu-latest
    if: ${{ secrets.GOOGLE_API_KEY != '' && secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + eval deps
        run: pip install -e ".[dev]"
      - name: Run evaluation harness (well-matched sample)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python evaluate.py --doc samples/general_sample.txt --strategy semantic --providers google,openai
      - name: Run evaluation harness (domain-mismatch sample)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python evaluate.py --doc samples/legal_mismatch_sample.txt --strategy semantic --providers google,openai --domain-mismatch-check
