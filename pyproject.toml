[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embedfallback"
version = "0.1.0"
description = "Rate-limit-resilient multi-provider embedding ingestion with cross-provider vector-space alignment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "requests>=2.28",
]

[project.optional-dependencies]
pdf = ["pypdf>=3.0"]
html = ["beautifulsoup4>=4.12"]
eval = ["rich>=13.0"]
dev = ["pytest>=7.0", "pypdf>=3.0", "beautifulsoup4>=4.12", "rich>=13.0"]
all = ["pypdf>=3.0", "beautifulsoup4>=4.12", "rich>=13.0"]

[tool.setuptools.packages.find]
include = ["embedfallback*"]

[tool.setuptools.package-data]
embedfallback = ["assets/*.json", "assets/prebuilt_anchor_cache/*.npy"]
